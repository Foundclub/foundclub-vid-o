<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 300; font-display: block; src: url("fonts/montserrat-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 400; font-display: block; src: url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 300; font-display: block; src: url("fonts/montserrat-latin-ext-300-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 400; font-display: block; src: url("fonts/montserrat-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 500; font-display: block; src: url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 500; font-display: block; src: url("fonts/montserrat-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 600; font-display: block; src: url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 600; font-display: block; src: url("fonts/montserrat-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 700; font-display: block; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 700; font-display: block; src: url("fonts/montserrat-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 800; font-display: block; src: url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 800; font-display: block; src: url("fonts/montserrat-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Montserrat"; font-weight: 900; font-display: block; src: url("fonts/montserrat-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      :root { --bleu: #01b3f4; --nuit: #0f191e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
      .plein { position: absolute; inset: 0; }

      /* Le fond reprend la couleur du bord des pages (≈ #0f191e), pour que la page se fonde dans le cadre vertical */
      #fond-halo { position: absolute; inset: 0;
        background: radial-gradient(900px 700px at 85% 20%, rgba(1,179,244,.10), rgba(1,179,244,0) 70%),
                    radial-gradient(900px 800px at 10% 85%, rgba(1,179,244,.07), rgba(1,179,244,0) 70%), var(--nuit); }

      /* Une page de 1080 × 1350, réduite à 0,88 : 950 × 1188, de y = 360 à 1548. Au-dessus : la place des stickers ;
         en dessous : la légende des réseaux. À droite, 65 px pour la colonne de boutons de TikTok et des Reels. */
      .page { position: absolute; left: 32px; top: 360px; width: 950px; height: 1188px; opacity: 0; transform-origin: 50% 50%; }
      .page .appuyer, .page .zoom { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .page img { display: block; width: 950px; height: 1188px;
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%),
                            linear-gradient(to bottom, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
        -webkit-mask-composite: source-in; mask-composite: intersect; }
      /* L'appui du doigt sur un bouton (un cercle, pas une étiquette) */
      .appui { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
        background: rgba(255,255,255,.28); border: 4px solid rgba(255,255,255,.85); opacity: 0; }

      /* Stickers façon story : fond blanc, texte noir, un peu penchés, sans icône ni halo (Adel, 28/10) */
      .sticker { position: absolute; left: 0; right: 0; display: flex; justify-content: center; opacity: 0; }
      .sticker span { display: inline-block; background: #fff; color: #0b0b0c; font-weight: 900; font-size: 54px; line-height: 1.1;
        padding: 10px 24px 12px; border-radius: 10px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }

      /* Carton final (repris du « week-end gâché ») */
      .icone-fc { width: 180px; height: 180px; border-radius: 42px; background: #000d12; border: 3px solid rgba(255,255,255,.18);
        display: flex; align-items: center; justify-content: center; font-size: 120px; letter-spacing: -0.09em; line-height: 1;
        box-shadow: 0 0 60px rgba(1,179,244,.45), 0 24px 60px rgba(0,0,0,.5); }
      .icone-fc .f { color: var(--bleu); font-weight: 600; } .icone-fc .c { color: #fff; font-weight: 300; }
      .marque { margin-top: 26px; font-size: 104px; line-height: 1; letter-spacing: 0.01em; position: relative; overflow: hidden; padding: 0 10px; }
      .marque .found { color: var(--bleu); font-weight: 800; } .marque .club { color: #fff; font-weight: 400; }
      .marque .reflet { position: absolute; top: -20%; bottom: -20%; width: 180px; left: -220px;
        background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
      #fin-voile { background: #001218; opacity: 0; }
      #fin { position: absolute; left: 0; right: 0; top: 560px; display: flex; flex-direction: column; align-items: center; }
      #fin .icone-fc { width: 220px; height: 220px; border-radius: 50px; font-size: 146px; }
      #fin .marque { margin-top: 40px; font-size: 128px; }
      #fin .phrase { margin-top: 46px; color: #fff; font-weight: 700; font-size: 50px; }
      #fin .badges { margin-top: 44px; display: flex; gap: 34px; align-items: center; }
      #fin .badges img { height: 110px; display: block; }
      #fin .badges .gp { height: 144px; margin: -17px -10px; }
      #fin .site { margin-top: 46px; color: var(--bleu); font-weight: 800; font-size: 50px; letter-spacing: .02em; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.000" data-width="1080" data-height="1920">

      <div id="fond" class="clip plein" data-start="0" data-duration="23.000" data-track-index="0"><div id="fond-halo"></div></div>

      <!-- Les pages du carrousel, telles qu'elles sont parties en images : elles défilent comme un carrousel qu'on fait glisser -->
      <div id="pages" class="clip plein" data-start="0" data-duration="23.000" data-track-index="1">
        <div id="page-0" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-01.png" alt="" /></div></div></div>
        <div id="page-1" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-02.png" alt="" /><div id="appui-1-0" class="appui" style="left: 607px; top: 950px;"></div></div></div></div>
        <div id="page-2" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-03.png" alt="" /><div id="appui-2-0" class="appui" style="left: 478px; top: 828px;"></div></div></div></div>
        <div id="page-3" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-04.png" alt="" /></div></div></div>
        <div id="page-4" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-05.png" alt="" /></div></div></div>
        <div id="page-5" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-06.png" alt="" /><div id="appui-5-0" class="appui" style="left: 700px; top: 901px;"></div></div></div></div>
        <div id="page-6" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-07.png" alt="" /><div id="appui-6-0" class="appui" style="left: 700px; top: 809px;"></div></div></div></div>
        <div id="page-7" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-08.png" alt="" /></div></div></div>
        <div id="page-8" class="page"><div class="appuyer"><div class="zoom"><img src="medias/pages/car-b/CAR-B-09.png" alt="" /><div id="appui-8-0" class="appui" style="left: 777px; top: 1082px;"></div></div></div></div>
      </div>

      <!-- Stickers façon story, au-dessus de la page : jamais posés sur l'écran de l'appli (Adel, 28/10) -->
      <div id="stickers" class="clip plein" data-start="0" data-duration="23.000" data-track-index="2">
        <div id="sticker-0" class="sticker" style="top: 150px;"><span>Pas de match ce week-end ?</span></div>
        <div id="sticker-1" class="sticker" style="top: 250px;"><span>Un amical en 7 étapes</span></div>
        <div id="sticker-2" class="sticker" style="top: 150px;"><span>Envoie-la à ton coach</span></div>
      </div>

      <!-- CARTON FINAL -->
      <div id="carton" class="clip plein" data-start="20.700" data-duration="2.300" data-track-index="9">
        <div id="fin-voile" class="plein"></div>
        <div id="fin">
          <div class="icone-fc"><span class="f">F</span><span class="c">C</span></div>
          <div class="marque"><span class="found">FOUND</span><span class="club">CLUB</span><span class="reflet"></span></div>
          <div class="phrase">Télécharge FoundClub</div>
          <div class="badges">
            <img src="medias/badges/app-store.svg" alt="Download on the App Store" />
            <img class="gp" src="medias/badges/google-play.svg" alt="Get it on Google Play" />
          </div>
          <div class="site">foundclub.app</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const PAGES = [{"debut": 0.0, "fin": 2.3, "appuis": []}, {"debut": 2.3, "fin": 4.6, "appuis": [{"a": 1.45}]}, {"debut": 4.6, "fin": 6.9, "appuis": [{"a": 1.45}]}, {"debut": 6.9, "fin": 9.2, "appuis": [], "vibre": 0.55}, {"debut": 9.2, "fin": 11.5, "appuis": []}, {"debut": 11.5, "fin": 13.8, "appuis": [{"a": 1.45}]}, {"debut": 13.8, "fin": 16.1, "appuis": [{"a": 1.25}]}, {"debut": 16.1, "fin": 18.4, "appuis": []}, {"debut": 18.4, "fin": 20.7, "appuis": [{"a": 1.0}]}];
      const STICKERS = [{"debut": 0.25, "fin": 2.3, "penche": -3}, {"debut": 0.95, "fin": 2.3, "penche": 2}, {"debut": 19.0, "fin": 20.7, "penche": -2}];
      const FIN = 20.700;
      // Chaque page arrive de la droite et repart à gauche, comme quand on fait glisser un carrousel ; pendant qu'elle est
      // là, elle avance très doucement vers nous (1 → 1,035).
      const GLISSE = 0.38;
      PAGES.forEach((p, i) => {
        const sel = `#page-${i}`;
        if (i === 0) tl.fromTo(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0);
        else tl.fromTo(sel, { opacity: 1, x: 1080, rotation: 2.5 }, { x: 0, rotation: 0, duration: GLISSE, ease: "power3.out" }, p.debut);
        tl.fromTo(`${sel} .zoom`, { scale: 1 }, { scale: 1.035, duration: p.fin - p.debut, ease: "none", transformOrigin: "50% 50%" }, p.debut);
        if (i < PAGES.length - 1) tl.to(sel, { x: -1080, rotation: -2.5, duration: GLISSE, ease: "power3.out" }, p.fin);
        else tl.to(sel, { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" }, p.fin - 0.1);
        (p.appuis || []).forEach((a, k) => {
          const s = `#appui-${i}-${k}`, t = p.debut + a.a;
          tl.fromTo(s, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 0.85, duration: 0.2, ease: "power2.out" }, t);
          tl.to(`${sel} .appuyer`, { scale: 0.985, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t + 0.12);
          tl.to(s, { opacity: 0, scale: 1.25, duration: 0.3, ease: "power1.in" }, t + 0.3);
        });
        // la notification : la page vibre comme un téléphone posé sur la table
        if (p.vibre != null) tl.to(sel, { x: 7, duration: 0.04, yoyo: true, repeat: 7, ease: "none" }, p.debut + p.vibre);
      });

      // Stickers : plaqués comme à la main, un peu penchés ; ils partent avec leur page
      STICKERS.forEach((s, i) => {
        tl.fromTo(`#sticker-${i}`, { opacity: 0, scale: 1.5, rotation: s.penche * 2 }, { opacity: 1, scale: 1, rotation: s.penche, duration: 0.14, ease: "power3.in" }, s.debut);
        tl.to(`#sticker-${i}`, { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, s.fin - 0.2);
      });

      // ── CARTON FINAL ──
      tl.fromTo("#fin-voile", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, FIN);
      tl.fromTo("#fin .icone-fc", { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, FIN + 0.2);
      tl.fromTo("#fin .marque", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, FIN + 0.4);
      tl.fromTo("#fin .reflet", { x: 0 }, { x: 1500, duration: 0.8, ease: "power2.inOut" }, FIN + 0.85);
      tl.fromTo("#fin .phrase", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, FIN + 0.7);
      tl.fromTo("#fin .badges", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, FIN + 0.95);
      tl.fromTo("#fin .site", { opacity: 0 }, { opacity: 1, duration: 0.4 }, FIN + 1.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
