<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
/*POLICES*/
      :root { --bleu: #01b3f4; --nuit: #001218; --vert: #27d6a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
      .plein { position: absolute; inset: 0; }
      #fond-halo { position: absolute; inset: -200px;
        background: radial-gradient(800px 700px at 25% 25%, rgba(1,179,244,.18), rgba(1,179,244,0) 70%),
                    radial-gradient(900px 800px at 80% 80%, rgba(39,214,163,.10), rgba(39,214,163,0) 70%), var(--nuit); }

      /* Les plans tournés (Adel, Clément, leur entourage) : plein cadre */
      .cadre-broll { position: absolute; inset: 0; transform-origin: 540px 960px; opacity: 0; }
      .cadre-broll video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .voile { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,18,24,.55) 0%, rgba(0,18,24,0) 35%, rgba(0,18,24,0) 70%, rgba(0,18,24,.5) 100%); }

      /* En-tête d'étape : le numéro dans un carré bleu, le titre, puis les sous-étapes (ce qu'on voit dans le téléphone) */
      .etape { position: absolute; left: 60px; right: 60px; top: 140px; opacity: 0; }
      .etape .num { position: absolute; left: 0; top: 0; width: 150px; height: 150px; border-radius: 34px; background: var(--bleu);
        color: var(--nuit); font-weight: 900; font-size: 112px; line-height: 150px; text-align: center; }
      .etape .titre { position: absolute; left: 178px; top: 4px; right: 0; color: #fff; font-weight: 900; font-size: 60px; line-height: 1.05; }
      .etape .titre .mot { display: inline-block; }
      .etape .titre .bleu { color: var(--bleu); }
      .sous { position: absolute; left: 0; right: 0; top: 184px; display: flex; gap: 10px; flex-wrap: nowrap; }
      .sous span { font-weight: 700; font-size: 25px; color: rgba(255,255,255,.45); padding: 8px 16px 9px; border-radius: 40px;
        border: 2px solid rgba(255,255,255,.18); white-space: nowrap; }
      .sous span.actif { color: var(--nuit); background: #fff; border-color: #fff; }

      /* Le téléphone */
      #tel { position: absolute; left: 246px; top: 430px; width: 588px; height: 1285px; border-radius: 80px; background: #081318; padding: 14px;
        box-shadow: 0 0 0 2px rgba(1,179,244,.45), 0 0 80px rgba(1,179,244,.28), 0 40px 90px rgba(0,0,0,.6); opacity: 0; }
      #ecran { position: relative; width: 560px; height: 1257px; border-radius: 66px; overflow: hidden; background: #0d1a20; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .vue { position: absolute; left: 0; top: 0; width: 560px; height: 1257px; opacity: 0; }
      .vue video, img.vue { width: 560px; height: 1257px; display: block; object-fit: cover; }
      .appui { position: absolute; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
        background: rgba(255,255,255,.3); border: 4px solid rgba(255,255,255,.9); opacity: 0; }
      /* La notification qui tombe du haut, comme une vraie (capture recadrée : rien d'autre de l'écran d'accueil) */
      #notif { position: absolute; left: 150px; top: 520px; width: 780px; border-radius: 30px; overflow: hidden; opacity: 0;
        box-shadow: 0 0 0 2px rgba(1,179,244,.6), 0 30px 80px rgba(0,0,0,.65); }
      #notif img { display: block; width: 780px; height: auto; }

      /* Stickers façon story (Adel, 28/10) : blancs, texte noir, penchés, jamais sur l'écran de l'appli */
      .sticker { position: absolute; left: 0; right: 0; display: flex; justify-content: center; opacity: 0; }
      .sticker span { display: inline-block; background: #fff; color: #0b0b0c; font-weight: 900; font-size: 62px; line-height: 1.1;
        padding: 12px 28px 14px; border-radius: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.25); text-align: center; }

      /* Carton final (repris du « week-end gâché ») */
      .icone-fc { width: 220px; height: 220px; border-radius: 50px; background: #000d12; border: 3px solid rgba(255,255,255,.18);
        display: flex; align-items: center; justify-content: center; font-size: 146px; letter-spacing: -0.09em; line-height: 1;
        box-shadow: 0 0 60px rgba(1,179,244,.45), 0 24px 60px rgba(0,0,0,.5); }
      .icone-fc .f { color: var(--bleu); font-weight: 600; } .icone-fc .c { color: #fff; font-weight: 300; }
      .marque { margin-top: 40px; font-size: 128px; line-height: 1; letter-spacing: 0.01em; position: relative; overflow: hidden; padding: 0 10px; }
      .marque .found { color: var(--bleu); font-weight: 800; } .marque .club { color: #fff; font-weight: 400; }
      .marque .reflet { position: absolute; top: -20%; bottom: -20%; width: 180px; left: -220px;
        background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
      #fin-voile { background: var(--nuit); opacity: 0; }
      #fin { position: absolute; left: 0; right: 0; top: 520px; display: flex; flex-direction: column; align-items: center; }
      #fin .phrase { margin-top: 46px; color: #fff; font-weight: 800; font-size: 54px; text-align: center; line-height: 1.15; }
      #fin .chemin { margin-top: 22px; color: var(--bleu); font-weight: 700; font-size: 40px; }
      #fin .badges { margin-top: 44px; display: flex; gap: 34px; align-items: center; }
      #fin .badges img { height: 110px; display: block; }
      #fin .badges .gp { height: 144px; margin: -17px -10px; }
      #fin .site { margin-top: 40px; color: #fff; font-weight: 800; font-size: 46px; letter-spacing: .02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUREE__" data-width="1080" data-height="1920">
      <div id="fond" class="clip plein" data-start="0" data-duration="__DUREE__" data-track-index="0"><div id="fond-halo"></div></div>

      <!-- ACCROCHE : un vrai match (tournage FoundClub), « Pas de match ce week-end ? » -->
      <div id="b-duel" class="cadre-broll">
        <video id="v-duel" src="medias/broll/duel.mp4" muted playsinline data-start="0" data-duration="2.6" data-track-index="1"></video>
        <div class="voile"></div>
      </div>

      <!-- LES 3 ÉTAPES -->
      <div id="et-1" class="etape"><div class="num">1</div>
        <div class="titre"><span class="mot">Publie</span> <span class="mot">ton</span> <span class="mot bleu">annonce</span></div>
        <div class="sous"><span>Ton équipe</span><span>Tes dates</span><span>L'adversaire</span><span>Un mot</span><span>Publier</span></div></div>
      <div id="et-2" class="etape"><div class="num">2</div>
        <div class="titre"><span class="mot">Une</span> <span class="mot">équipe</span> <span class="mot">te</span> <span class="mot bleu">propose</span> <span class="mot bleu">un</span> <span class="mot bleu">match</span></div>
        <div class="sous"><span>Tu es prévenu</span><span>Vous en parlez</span></div></div>
      <div id="et-3" class="etape"><div class="num">3</div>
        <div class="titre"><span class="mot">Tu</span> <span class="mot">acceptes,</span> <span class="mot">c'est</span> <span class="mot bleu">dans</span> <span class="mot bleu">le</span> <span class="mot bleu">planning</span></div>
        <div class="sous"><span>Accepter</span><span>Le planning des deux équipes</span></div></div>

      <div id="tel"><div id="ecran"><div id="camera">
        <div id="vue-e1" class="vue"><video id="v-e1" src="medias/ecran/etape1.mp4" muted playsinline data-start="__E1__" data-duration="7.8" data-track-index="3"></video></div>
        <img id="vue-disc" class="vue" src="medias/captures/17b_discussion_vue_annonceur_valbrune.png" alt="" />
        <img id="vue-acc" class="vue" src="medias/captures/23a_accepter_cette_proposition.png" alt="" />
        <img id="vue-plan" class="vue" src="medias/captures/24b_planning_montrivage_carte_du_match.png" alt="" />
<!--APPUIS-->
      </div></div></div>
      <div id="notif"><img src="medias/captures/16_notification_un_adversaire_se_propose_recadre.png" alt="" /></div>

      <!-- FIN : un vrai match, « Il ne reste qu'à jouer. » -->
      <div id="b-celeb" class="cadre-broll">
        <video id="v-celeb" src="medias/broll/celebration.mp4" muted playsinline data-start="__CELEB__" data-duration="2.6" data-track-index="2"></video>
        <div class="voile"></div>
      </div>

<!--STICKERS-->

      <div id="carton" class="clip plein" data-start="__FIN__" data-duration="__DUREE_CARTON__" data-track-index="9">
        <div id="fin-voile" class="plein"></div>
        <div id="fin">
          <div class="icone-fc"><span class="f">F</span><span class="c">C</span></div>
          <div class="marque"><span class="found">FOUND</span><span class="club">CLUB</span><span class="reflet"></span></div>
          <div class="phrase">Trouve ton prochain<br>match amical</div>
          <div class="chemin">Accueil → Matchs amicaux</div>
          <div class="badges">
            <img src="medias/badges/app-store.svg" alt="Download on the App Store" />
            <img class="gp" src="medias/badges/google-play.svg" alt="Get it on Google Play" />
          </div>
          <div class="site">foundclub.app</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = /*T*/;
      const APPUIS = /*APPUISJS*/;
      const STICKERS = /*STICKERSJS*/;
/*JS*/
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
